<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 장바구니</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* 테이블 스타일 */
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; border-bottom: 1px solid #eee; text-align: center; }
        .course-link { color: #3498db; cursor: pointer; text-decoration: underline; font-weight: bold; }
        .course-link:hover { color: #2980b9; }

        /* 모달(팝업) 스타일 */
        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); z-index: 1000; 
            justify-content: center; align-items: center; 
        }
        .modal-content { 
            background: white; padding: 30px; border-radius: 8px; width: 400px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative;
        }
        .modal-close { 
            position: absolute; top: 15px; right: 15px; background: none; border: none; 
            font-size: 20px; cursor: pointer; color: #7f8c8d;
        }
        .modal-title { font-size: 22px; font-weight: bold; margin-bottom: 15px; color: #2c3e50; }
        .modal-body { margin-bottom: 20px; color: #555; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h1>내 장바구니</h1>
    <table>
        <thead>
            <tr>
                <th>강의명 (클릭하여 상세 보기)</th>
                <th>상태</th>
                <th>액션</th>
            </tr>
        </thead>
        <tbody id="cart-list">
            <tr><td colspan="3">데이터를 불러오는 중입니다...</td></tr>
        </tbody>
    </table>
</div>

<!-- 모달 레이어 -->
<div class="modal-overlay" id="courseModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal(event)">&times;</button>
        <div class="modal-title" id="m-title">강의명 로딩중...</div>
        <div class="modal-body" id="m-body">
            데이터를 불러오는 중입니다...
        </div>
    </div>
</div>

<script>
    // 강의 상세 정보 팝업을 연다.
    async function openModal(courseId) {
        const modal = document.getElementById('courseModal');
        modal.style.display = 'flex';
        
        document.getElementById('m-title').innerText = '강의 정보 로딩중...';
        document.getElementById('m-body').innerHTML = '<p>데이터를 불러오고 있습니다.</p>';

        try {
            const res = await fetch(`/api/get_course_detail.php?id=${courseId}`);
            const result = await res.json();

            if (result.status === 'success') {
                const data = result.data;
                const isFull = data.current_enrolled >= data.max_capacity;
                const statusText = isFull ? '<span style="color:red; font-weight:bold;">[마감]</span>' : '<span style="color:blue;">[신청가능]</span>';
                
                // 대학교 강의계획서 스타일로 UI를 구성하여 렌더링한다.
                document.getElementById('m-title').innerText = data.title;
                document.getElementById('m-body').innerHTML = `
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-bottom: 20px;">
                        <table style="width: 100%; border: none; text-align: left;">
                            <tr>
                                <td style="padding: 5px 0; border: none;"><strong>과목유형:</strong> ${data.course_type}</td>
                                <td style="padding: 5px 0; border: none;"><strong>학점:</strong> ${data.credits}학점</td>
                            </tr>
                            <tr>
                                <td style="padding: 5px 0; border: none;"><strong>정원현황:</strong> ${data.current_enrolled} / ${data.max_capacity}</td>
                                <td style="padding: 5px 0; border: none;"><strong>상태:</strong> ${statusText}</td>
                            </tr>
                        </table>
                    </div>
                    
                    <h4 style="margin-bottom: 10px; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 5px;">교과목 개요</h4>
                    <div style="line-height: 1.6; color: #444; font-size: 15px; white-space: pre-wrap;">
                        ${data.description}
                    </div>
                `;
            } else {
                document.getElementById('m-body').innerText = result.message;
            }
        } catch (error) {
            document.getElementById('m-body').innerText = '서버와 통신하는 데 실패했습니다.';
        }
    }

    // 모달을 닫는다. 배경 클릭 시에도 동작하도록 설계했다.
    function closeModal(event) {
        if (!event || event.target.id === 'courseModal' || event.target.className === 'modal-close') {
            document.getElementById('courseModal').style.display = 'none';
        }
    }

    // 서버에서 장바구니 데이터를 가져와 테이블에 동적으로 렌더링한다.
    async function loadCart() {
        try {
            const res = await fetch('/api/add_cart.php');
            const result = await res.json();
            const tbody = document.getElementById('cart-list');
            
            // 기존 렌더링된 데이터를 초기화한다.
            tbody.innerHTML = '';

            if (result.status === 'error') {
                tbody.innerHTML = `<tr><td colspan="3">${result.message}</td></tr>`;
                return;
            }

            if (result.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">장바구니에 담긴 강의가 없습니다.</td></tr>';
                return;
            }

            // DB에서 가져온 데이터를 반복문으로 그려낸다.
            result.data.forEach(c => {
                const isFull = c.current >= c.max;
                const statusText = isFull 
                    ? '<span style="color:red; font-weight:bold;">마감</span>' 
                    : '<span style="color:blue;">여유</span>';
                    
                const btnHtml = isFull 
                    ? `<button class="btn-disabled" disabled style="padding:5px 10px; border:none; border-radius:4px; background:#bdc3c7; color:white; cursor:not-allowed;">신청불가</button>` 
                    : `<button style="background:#27ae60; color:white; padding:5px 10px; border:none; border-radius:4px; cursor:pointer;" onclick="enrollCourse(${c.id})">신청하기</button>`;

                tbody.innerHTML += `
                    <tr>
                        <td><span class="course-link" onclick="openModal(${c.id})">${c.title}</span></td>
                        <td>${statusText} (${c.current}/${c.max})</td>
                        <td>${btnHtml}</td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error('Error fetching cart:', error);
        }
    }

    async function enrollCourse(courseId) {
    if (!confirm("이 강의를 수강신청 하시겠습니까?")) return;

    try {
        // 기존 courses.html에서 쓰던 수강신청 API 재사용
        const res = await fetch('/api/enroll.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ course_id: courseId })
        });
        const result = await res.json();
        
        alert(result.message);
        
        if (result.status === 'success') {
            // 성공 시 장바구니 목록을 다시 불러와 화면에서 해당 강의를 사라지게 한다.
            loadCart();
        }
    } catch (error) {
        alert("통신 오류가 발생했습니다.");
    }
}

    // 페이지가 켜지면 loadCart 함수를 자동으로 실행한다.
    document.addEventListener('DOMContentLoaded', loadCart);
</script>

</body>
</html>
