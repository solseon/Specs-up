<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>강의 목록 (API 기반)</title>
    <style>
        /* 기본적인 테이블 UI를 구성한다. */
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        .enroll-btn { cursor: pointer; padding: 5px 10px; }
    </style>
</head>
<body>
    <h1>수강신청 시스템</h1>
    
    <!-- 자바스크립트가 데이터를 삽입할 빈 테이블 뼈대를 준비한다. -->
    <table>
        <thead>
            <tr>
                <th>강의 ID</th>
                <th>강의명</th>
                <th>신청 인원</th>
                <th>액션</th>
            </tr>
        </thead>
        <tbody id="course-list">
            <tr><td colspan="4">데이터를 불러오는 중입니다...</td></tr>
        </tbody>
    </table>

    <script>
        // API 서버와 통신하여 강의 목록을 가져오고 화면에 렌더링한다.
        async function loadCourses() {
            try {
                const response = await fetch('/api/get_courses.php');
                const result = await response.json();

                if (result.status === 'success') {
                    const tbody = document.getElementById('course-list');
                    tbody.innerHTML = ''; 

                    // API에서 넘겨준 로그인 상태를 변수에 저장한다.
                    const isLoggedIn = result.auth.logged_in;

                    result.data.forEach(course => {
                        const tr = document.createElement('tr');
                        
                        // 로그인 여부 및 개별 강의 수강 여부에 따라 버튼의 HTML을 다르게 렌더링한다.
                        let buttonHtml = '';
                        if (isLoggedIn) {
                            if (course.is_enrolled) {
                                // 이미 수강신청한 강의는 초록색 '수강 완료' 버튼으로 렌더링하고 클릭을 막는다.
                                buttonHtml = `<button class="enroll-btn disabled" disabled style="background-color:#4CAF50; color:white; border:none; cursor:not-allowed;">수강 완료</button>`;
                            } else {
                                // 수강 전인 강의만 파란색 '신청하기' 버튼을 활성화한다.
                                buttonHtml = `<button class="enroll-btn" data-id="${course.id}">신청하기</button>`;
                            }
                        } else {
                            // 비로그인 상태면 버튼을 비활성화(disabled) 처리한다.
                            buttonHtml = `<button class="enroll-btn disabled" disabled style="background-color:#ccc; border:none; cursor:not-allowed;">로그인 필요</button>`;
                        }

                        // 누락되었던 테이블 행 데이터 삽입 및 렌더링 로직을 복구한다.
                        tr.innerHTML = `
                            <td>${course.id}</td>
                            <td>${course.name}</td>
                            <td>${course.current} / ${course.max}</td>
                            <td>${buttonHtml}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    alert('데이터를 불러오는데 실패했습니다: ' + result.message);
                }
            } catch (error) {
                console.error('Fetch error:', error);
            }
        }

        // 1. 브라우저가 HTML을 모두 읽으면 강의 목록 호출 함수를 실행한다.
        document.addEventListener('DOMContentLoaded', loadCourses);

        // 2. 이벤트 위임 방식을 사용하여 동적으로 생성된 버튼의 클릭을 처리한다.
        document.getElementById('course-list').addEventListener('click', async function(e) {
            // 클릭된 요소가 활성화된 'enroll-btn' 클래스인지 검증한다.
            if (e.target && e.target.classList.contains('enroll-btn') && !e.target.disabled) {
                const courseId = e.target.getAttribute('data-id');
                
                // 버튼 비활성화로 중복 클릭을 방지한다.
                e.target.disabled = true;
                e.target.innerText = '처리 중...';
                
                try {
                    const enrollResponse = await fetch('/api/enroll.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ course_id: courseId })
                    });
                    
                    const enrollResult = await enrollResponse.json();
                    
                    alert(enrollResult.message);
                    
                    if (enrollResult.status === 'success') {
                        // 수강신청 성공 시 목록을 다시 불러와 인원수와 버튼 상태를 갱신한다.
                        loadCourses();
                    } else {
                        // 실패 시 버튼을 다시 활성화한다.
                        e.target.disabled = false;
                        e.target.innerText = '신청하기';
                    }
                } catch (error) {
                    console.error('Enroll error:', error);
                    alert('서버 통신 중 에러가 발생했습니다.');
                    e.target.disabled = false;
                    e.target.innerText = '신청하기';
                }
            }
        });
    </script>
</body>
</html>
